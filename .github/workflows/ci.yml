name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Workflow JSON is in sync with src/
        run: npm run check:workflow
      - name: Tests (node:test, zero dependencies)
        run: npm test
      - name: Offline demo against fictional fixtures
        run: npm run demo -- --quiet
